<div role="alert" class="rounded-lg border border-accent/50 bg-surface p-4">
  <p>{{ 'common.errors.' + (kind() ?? 'http') | transloco }}</p>
  <button
    type="button"
    class="mt-3 rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-text"
    (click)="retry.emit()"
  >
    {{ 'common.retry' | transloco }}
  </button>
</div>
